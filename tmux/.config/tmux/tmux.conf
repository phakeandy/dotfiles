set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on
set -a terminal-features 'xterm-256color:RGB'
set -g history-limit 50000
setw -g aggressive-resize on

# Closing the last session/window of a session must not detach the client, so
# sesh can kill the session you were in and leave you somewhere else instead of
# dropping you out of tmux. Recommended in sesh's README.
set -g detach-on-destroy off

# set -g extended-keys on
# set -g extended-keys-format csi-u

set -g base-index 1 # window index increse from 1
set -g renumber-windows on

# set -s set-clipboard on # Support OSC52

set -g status-position top

bind r source-file ~/.config/tmux/tmux.conf \; display "Source config file: ~/.config/tmux/tmux.conf"

# Prefix + i: show server-local stable IDs and the human-readable location.
bind-key i display-message -d 10000 'session=#{session_name} (#{session_id}) | window=#{window_name} (#{window_id}) | pane=#{pane_id} | target=#{session_name}:#{window_index}.#{pane_index}'

# Should config terminal send \e[32;5;32~ when press Ctrl+Shift+Space
# bind-key -n "\e[32;5;32~" copy-mode
bind m set -g mouse \; display "Mouse Mode: #{?mouse,ON,OFF}"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi i send -X cancel
unbind -Tcopy-mode MouseDragEnd1Pane

bind -T copy-mode-vi '[' send-keys -X search-backward '^\$ |^MySQL.*> |\s+#{1,6}'
bind -T copy-mode-vi ']' send-keys -X search-forward '^\$ |^MySQL.*> |\s+#{1,6}'

bind-key -n M-o resize-pane -Z
bind-key -n C-Tab last-window
# Cycle through windows by index without the prefix key.
# bind-key -n F3 next-window
# bind-key -n F4 previous-window

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0

# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# bind -n M-Left   resize-pane -L
# bind -n M-Right  resize-pane -R
# bind -n M-Up     resize-pane -U
# bind -n M-Down   resize-pane -D

bind-key Escape copy-mode \; send-keys -X start-of-line
bind-key C-[ copy-mode \; send-keys -X start-of-line

# bind-key C-\\ if-shell -F '#{==:#{session_name},popup}' {
#     detach-client
# } {
#     display-popup -d "#{pane_current_path}" -xC -yC -w60% -h70% -E \
#     'tmux new -s popup && tmux kill-session -t popup || true'
# }

bind-key C-\\ display-popup \
    -d "#{pane_current_path}" \
    -xC -yC \
    -w70% -h80% \
    -E 'exec bash'

# Keep installed plugins outside the dotfiles symlink.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Launch keys: prefix + C-f opens sesh (smart tmux session manager, see
# ~/bin/sesh-picker), prefix + F opens tmux-fingers. @fingers-key has to be set
# before the tpm run line below, because tpm sources the plugins' .tmux files at
# that point and they read the option then.
#
# sesh replaced tmux-sessionx: same job (tmux sessions + zoxide dirs, plus
# sesh.toml entries and tmuxinator) but its own popup plumbing, so it isn't
# affected by the fzf --popup removal that broke sessionx. To go back, restore
# the two @sessionx-* options below and the plugin line at the bottom.
# set -g @sessionx-bind 'C-f'
# set -g @sessionx-fzf-builtin-tmux 'on'
set -g @fingers-key 'F'

bind-key C-f display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' sesh ' '~/bin/sesh-picker'

# Status line: Catppuccin Latte (light), matching the terminal theme and the
# nvim colorscheme. The previous Tokyo Night Day values are kept commented for
# a quick switch back.
set -g status-style 'bg=#e6e9ef,fg=#4c4f69'
# set -g status-style 'bg=#d0d5e3,fg=#3760bf'
set -g status-left-length 40
# While the prefix key (C-b) is held, tmux re-renders the status line and
# client_prefix turns the session badge peach, making the active session
# obvious mid-chord. Styles must stay comma-free here: a comma inside
# #[...] nested in #{?} is parsed as the conditional separator.
set -g status-left '#{?client_prefix,#[bg=#fe640b]#[fg=#eff1f5]#[bold] #S #[bg=#e6e9ef]#[fg=#fe640b],#[bg=#1e66f5]#[fg=#eff1f5]#[bold] #S #[bg=#e6e9ef]#[fg=#1e66f5]}'
# set -g status-left '#{?client_prefix,#[bg=#b15c00]#[fg=#e1e2e7]#[bold] #S #[bg=#d0d5e3]#[fg=#b15c00],#[bg=#2e7de9]#[fg=#e1e2e7]#[bold] #S #[bg=#d0d5e3]#[fg=#2e7de9]}'
set -g status-right-length 60
set -g status-right '#[fg=#40a02b]#H#[fg=#8c8fa1] | #[fg=#1e66f5]%H:%M #[fg=#8c8fa1]%d-%b'
# set -g status-right '#[fg=#587539]#H#[fg=#848cb5] | #[fg=#2e7de9]%H:%M #[fg=#848cb5]%d-%b'
set -g window-status-style 'fg=#6c6f85,bg=default'
set -g window-status-format ' #I:#W '
set -g window-status-current-style 'bg=#bcc0cc,fg=#1e66f5,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-activity-style 'fg=#fe640b,bg=#e6e9ef'
set -g pane-border-style 'fg=#acb0be'
set -g pane-active-border-style 'fg=#1e66f5'
set -g message-style 'bg=#bcc0cc,fg=#1e66f5'

# TPM plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'omerxx/tmux-sessionx'  # superseded by sesh, see prefix+C-f above

run '~/.tmux/plugins/tpm/tpm'

