# Catppuccin Mocha palette for the tmux status line.
#
# One file per flavour; ~/bin/theme symlinks ~/.tmux/theme.conf at the chosen
# one and reloads it. Only style options belong here, the formats themselves
# live in tmux.conf, so switching flavours never changes the layout.
#
# Styles must stay comma-free inside #[...] when nested in #{?}: a comma there
# is parsed as the conditional separator.

set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left '#{?client_prefix,#[bg=#fab387]#[fg=#1e1e2e]#[bold] #S #[bg=#181825]#[fg=#fab387],#[bg=#89b4fa]#[fg=#1e1e2e]#[bold] #S #[bg=#181825]#[fg=#89b4fa]}'
set -g status-right '#[fg=#a6e3a1]#H#[fg=#7f849c] | #[fg=#89b4fa]%H:%M #[fg=#7f849c]%d-%b'
set -g window-status-style 'fg=#6c7086,bg=default'
set -g window-status-current-style 'bg=#45475a,fg=#89b4fa,bold'
set -g window-status-activity-style 'fg=#fab387,bg=#181825'
set -g pane-border-style 'fg=#585b70'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#45475a,fg=#89b4fa'
