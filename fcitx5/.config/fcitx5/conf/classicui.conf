# fcitx5 classicui —— 候选框放大。等价于旧 ibus 的 GDK_DPI_SCALE=1.7 hack：
# ibus 那边是 GTK 13pt 的 panel 整体缩放 1.7（≈22pt），这里直接给字号。
# 嫌大/嫌小：只改下面两个数字（22 = 原来的效果，18 = 温和，26 = 更大），
# 然后 `fcitx5 -r -d` 重启即时生效。

# 候选框字体（中文候选走 Noto Sans CJK）
Font="Noto Sans CJK SC 22"
# 右键菜单 / 托盘弹出菜单的字体
MenuFont="Noto Sans CJK SC 18"

Theme=default
DarkTheme=default-dark
UseDarkTheme=False
# 横排候选，跟旧 ibus 的候选条一致；想要竖排改成 True
VerticalCandidateList=False
WheelForPaging=True
